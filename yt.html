<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIP TV trailer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- Trailer page for the VIP TV app. Host this file anywhere on the web (e.g. GitHub Pages).
     The TV opens it as  yt.html?v=<YouTube video id>. YouTube plays here because the page has a real address. -->
<script>
  var m = location.search.match(/[?&]v=([\w-]{11})/);
  if (m) {
    var f = document.createElement('iframe');
    f.allow = 'autoplay; encrypted-media';
    f.src = 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1&controls=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
