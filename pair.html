<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIP TV — إضافة حساب</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: #0d1424; color: #e8ecf5; }
  main { max-width: 460px; margin: 0 auto; padding: 28px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #9aa6c2; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
  label { display: block; font-size: 14px; color: #c5cde0; margin: 14px 0 6px; }
  input { box-sizing: border-box; width: 100%; padding: 13px 14px; font-size: 16px; border-radius: 10px; border: 1px solid #2b3650; background: #141d33; color: #fff; }
  input:focus { outline: 2px solid #f5c518; border-color: transparent; }
  .ltr { direction: ltr; text-align: left; }
  button { width: 100%; margin-top: 24px; padding: 15px; font-size: 17px; font-weight: bold; border: 0; border-radius: 12px; background: #f5c518; color: #0d1424; }
  button:disabled { opacity: .6; }
  #msg { margin-top: 18px; font-size: 15px; text-align: center; min-height: 22px; }
  .ok { color: #7ee2a8; } .bad { color: #ff8a8a; }
</style>
</head>
<body>
<main>
  <h1>إضافة حساب على VIP TV</h1>
  <p>اكتب بيانات الاشتراك وابعتها، والشاشة هتدخل لوحدها. البيانات بتتشفّر على الموبايل بمفتاح موجود في الكود اللي صوّرته بس، ومحدش غير الشاشة يقدر يقراها.</p>
  <p id="code"></p>
  <form id="f">
    <label for="name">اسم الحساب (اختياري)</label>
    <input id="name" placeholder="مثلاً: البيت">
    <label for="server">السيرفر</label>
    <input id="server" class="ltr" placeholder="http://example.com:8080" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label for="user">اسم المستخدم</label>
    <input id="user" class="ltr" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label for="pass">كلمة السر</label>
    <input id="pass" class="ltr" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button id="send" type="submit">ابعت للشاشة</button>
  </form>
  <div id="msg"></div>
</main>
<!-- Opened from the QR code on the TV:  pair.html#t=<topic>&k=<key>
     The part after # never leaves the phone. The account is XOR-ed with the one-time key (as long as the
     message), sent to ntfy.sh/<topic>, and the TV (which made the key) decodes it. -->
<script>
  var h = new URLSearchParams(location.hash.slice(1)), topic = h.get('t') || '', key = h.get('k') || '';
  var msg = document.getElementById('msg');
  function say(t, cls) { msg.textContent = t; msg.className = cls || ''; }
  function fromB64url(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function toB64(a) { var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  if (topic) document.getElementById('code').textContent = 'كود الشاشة: ' + topic.substr(6, 6).toUpperCase() + ' (لازم يكون زي اللي على الشاشة)';
  if (!/^viptv-[a-f0-9]{20,}$/.test(topic) || key.length < 100) { say('الكود مش كامل. صوّر الكود اللي على الشاشة تاني.', 'bad'); document.getElementById('send').disabled = true; }
  document.getElementById('f').onsubmit = function (e) {
    e.preventDefault();
    function val(id) { return document.getElementById(id).value.trim(); }
    var acc = { v: 'VTV1', n: val('name'), s: val('server'), u: val('user'), p: val('pass') };
    var data = new TextEncoder().encode(JSON.stringify(acc)), k = fromB64url(key);
    if (data.length > k.length) { say('البيانات طويلة أوي. اختصر اسم الحساب.', 'bad'); return; }
    var out = new Uint8Array(data.length);
    for (var i = 0; i < data.length; i++) out[i] = data[i] ^ k[i];
    var btn = document.getElementById('send');
    btn.disabled = true; say('بيبعت...');
    fetch('https://ntfy.sh/' + topic, { method: 'POST', body: toB64(out) }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      say('اتبعت ✓ بص على الشاشة، هتدخل لوحدها.', 'ok');
      history.replaceState(null, '', location.pathname);   // the one-time key is used: a reload can't send again
    }).catch(function () { btn.disabled = false; say('ماتبعتش. اتأكد إن الموبايل عليه نت وجرّب تاني.', 'bad'); });
  };
</script>
</body>
</html>
